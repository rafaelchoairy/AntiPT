plugins { id 'com.android.application' }

android {
    namespace 'com.choairy.antipt'
    compileSdk 35
    defaultConfig {
        applicationId 'com.choairy.antipt'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
